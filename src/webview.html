<body>
	<div id="app">
		<div class="search-container">
			<div class="input-row">
				<input type="text" class="vscode-textfield search-input" v-model="search_query" @input="on_search_input" placeholder="Search..." autocomplete="off" ref="search_input" />
				<button class="toggle-filters" :class="{ active: show_filters }" @click="show_filters = ! show_filters" title="Toggle Search Details">
					<i class="codicon codicon-ellipsis"></i>
				</button>
			</div>
			<div v-if="show_filters" class="filters">
				<div class="filter-label">files to include</div>
				<input type="text" class="vscode-textfield filter-input" v-model="include_query" @input="on_search_input" placeholder="e.g. *.js, src/" autocomplete="off" />
				<div class="filter-label">files to exclude</div>
				<input type="text" class="vscode-textfield filter-input" v-model="exclude_query" @input="on_search_input" placeholder="e.g. *.test.js, dist/" autocomplete="off" />
			</div>
		</div>
		<div v-if="result_count_text" class="result-count">{{ result_count_text }}</div>
		<div class="results-container" ref="results_container">
			<div v-if="! results.length && search_query.trim()" class="no-results">
				No results found.
			</div>
			<div v-for="(item, fi) in results" :key="item.path" class="file-group">
				<div class="file-header" :class="{ selected: is_file_selected(fi) }" @click="toggle_file(fi)">
					<i class="codicon icon-arrow" :class="item.collapsed ? 'codicon-chevron-right' : 'codicon-chevron-down'"></i>
					<img class="file-icon" :src="'img/file-icons/' + (item.icon || 'default_file.svg')">
					<span class="file-name">{{ get_file_name(item.path) }}</span>
					<span class="file-path">{{ get_dir_path(item.path) }}</span>
					<span class="badge">{{ item.matches.length }}</span>
				</div>
				<div v-if="! item.collapsed" class="file-matches">
					<div v-for="(match, mi) in item.matches" :key="match.line_number + '-' + mi" class="match-line" :class="{ selected: is_match_selected(fi, mi) }" @click="open_match(fi, mi)">
						<span class="line-number">{{ match.line_number }}</span>
						<span class="line-text" :title="match.line_text">{{ match.line_text.trim() }}</span>
					</div>
				</div>
			</div>
		</div>

	<script type="module">
		import { createApp, ref, computed, onMounted, nextTick, watch } from 'vue'
		const vscode = acquireVsCodeApi()
		createApp({
			setup() {
				const search_query = ref(localStorage.getItem('search_query') || '')
				const include_query = ref(localStorage.getItem('search_include') || '')
				const exclude_query = ref(localStorage.getItem('search_exclude') || '')
				const show_filters = ref(localStorage.getItem('search_show_filters') === '1' || !! (include_query.value || exclude_query.value))
				const results = ref([])
				const has_more = ref(false)
				const workspace_folders = ref([])
				const search_input = ref(null)
				const results_container = ref(null)
				const selected = ref(-1)
				let search_debouncer = null

				const result_count_text = computed(() => {
					if (! results.value.length) return ''
					const total_matches = results.value.reduce((sum, item) => sum + item.matches.length, 0)
					return total_matches + ' match' + (total_matches === 1 ? '' : 'es') +
						' in ' + results.value.length + ' file' + (results.value.length === 1 ? '' : 's') +
						(has_more.value ? ' (truncated, please refine your search)' : '')
				})

				// A flat, ordered list of the currently-visible navigable rows (file headers and,
				// for expanded files, their match lines). Used for keyboard navigation.
				const flat_rows = computed(() => {
					const rows = []
					results.value.forEach((file, fi) => {
						rows.push({ kind: 'file', fi })
						if (! file.collapsed)
							file.matches.forEach((match, mi) => rows.push({ kind: 'match', fi, mi }))
					})
					return rows
				})

				const is_file_selected = (fi) => {
					const row = flat_rows.value[selected.value]
					return !! row && row.kind === 'file' && row.fi === fi
				}
				const is_match_selected = (fi, mi) => {
					const row = flat_rows.value[selected.value]
					return !! row && row.kind === 'match' && row.fi === fi && row.mi === mi
				}

				const scroll_selected_into_view = () => nextTick().then(() => {
					const el = results_container.value?.querySelector('.selected')
					el?.scrollIntoView({ block: 'nearest' })
				})

				const move = (delta) => {
					const rows = flat_rows.value
					if (! rows.length) return
					let i = selected.value < 0 ? (delta > 0 ? 0 : rows.length - 1) : selected.value + delta
					if (i < 0) i = 0
					if (i >= rows.length) i = rows.length - 1
					selected.value = i
					scroll_selected_into_view()
				}

				const toggle_file = (fi) => {
					results.value[fi].collapsed = ! results.value[fi].collapsed
				}

				const open_match = (fi, mi) => {
					const file = results.value[fi]
					const match = file.matches[mi]
					// keep the clicked/activated row selected
					const rows = flat_rows.value
					const idx = rows.findIndex(r => r.kind === 'match' && r.fi === fi && r.mi === mi)
					if (idx !== -1) selected.value = idx
					vscode.postMessage({ type: 'open_file', path: file.path, line_number: match.line_number })
				}

				const activate = () => {
					const row = flat_rows.value[selected.value]
					if (! row) return
					if (row.kind === 'file') toggle_file(row.fi)
					else open_match(row.fi, row.mi)
				}

				const set_collapsed = (val) => {
					const row = flat_rows.value[selected.value]
					if (! row) return
					if (row.kind === 'file')
						results.value[row.fi].collapsed = val
					else if (val) {
						// left on a match: jump up to its file header
						const rows = flat_rows.value
						for (let i = selected.value; i >= 0; i--)
							if (rows[i].kind === 'file') { selected.value = i; break }
						scroll_selected_into_view()
					}
				}

				// F4 / shift+F4 from the extension: go to next/previous match line and open it.
				const nav = (direction) => {
					const rows = flat_rows.value
					if (! rows.length) return
					const step = direction === 'next' ? 1 : -1
					let i = selected.value
					for (;;) {
						i += step
						if (i < 0 || i >= rows.length) return
						if (rows[i].kind === 'match') {
							selected.value = i
							open_match(rows[i].fi, rows[i].mi)
							return
						}
					}
				}

				const focus_search = () => search_input.value?.focus()

				const on_keydown = (e) => {
					const target = e.target
					// let the include/exclude text inputs handle their own keys normally
					if (target && target.classList && target.classList.contains('filter-input')) return
					const in_search = target === search_input.value
					switch (e.key) {
						case 'ArrowDown':
							e.preventDefault()
							move(1)
							break
						case 'ArrowUp':
							if (in_search) break
							e.preventDefault()
							move(-1)
							break
						case 'Enter':
							e.preventDefault()
							activate()
							break
						case 'ArrowRight':
							if (in_search) break
							e.preventDefault()
							set_collapsed(false)
							break
						case 'ArrowLeft':
							if (in_search) break
							e.preventDefault()
							set_collapsed(true)
							break
						case 'Escape':
							if (in_search) break
							e.preventDefault()
							focus_search()
							break
					}
				}

				const on_search_input = () => {
					clearTimeout(search_debouncer)
					search_debouncer = setTimeout(() => {
						localStorage.setItem('search_query', search_query.value)
						localStorage.setItem('search_include', include_query.value)
						localStorage.setItem('search_exclude', exclude_query.value)
						vscode.postMessage({
							type: 'search',
							query: search_query.value,
							include: include_query.value,
							exclude: exclude_query.value,
						})
					}, 30)
				}

				watch(show_filters, (v) => localStorage.setItem('search_show_filters', v ? '1' : '0'))
				watch(() => results.value.length, (len) =>
					vscode.postMessage({ type: 'has_results', value: len > 0 }))

				const get_file_name = (path) =>
					path.split('/').pop()

				const get_dir_path = (path) => {
					// Find the workspace folder this file belongs to
					let workspace_folder = null
					let longest_match = 0
					for (const folder of workspace_folders.value) {
						if (path.startsWith(folder.path + '/') && folder.path.length > longest_match) {
							workspace_folder = folder
							longest_match = folder.path.length
						}
					}
					if (! workspace_folder) {
						const parts = path.split('/')
						parts.pop()
						return parts.join('/')
					}
					let relative_path = path.substring(workspace_folder.path.length + 1)
					const parts = relative_path.split('/')
					parts.pop()
					const relative_dir = parts.join('/')
					return relative_dir ? `${workspace_folder.name} • ${relative_dir}` : workspace_folder.name
				}
				const highlight_search_terms = () => {
					if (! search_query.value.trim() || ! CSS.highlights) {
						CSS.highlights?.clear()
						return
					}
					CSS.highlights.clear()
					const ranges = []
					const search_terms_lower = search_query.value.trim().split(/\s+/).filter(Boolean).map(t => t.toLowerCase())
					const line_elements = document.querySelectorAll('.line-text')
					line_elements.forEach(element => {
						const text = element.textContent
						if (! text) return
						const lower_text = text.toLowerCase()
						search_terms_lower.forEach(term => {
							let index = 0
							while ((index = lower_text.indexOf(term, index)) !== -1) {
								const range = new Range()
								const text_node = element.firstChild
								if (text_node && text_node.nodeType === Node.TEXT_NODE) {
									range.setStart(text_node, index)
									range.setEnd(text_node, index + term.length)
									ranges.push(range)
								}
								index += term.length
							}
						})
					})
					if (ranges.length > 0) {
						const highlight = new Highlight(...ranges)
						CSS.highlights.set('search-match', highlight)
					}
				}
				window.addEventListener('message', (event) => {
					const message = event.data
					if (message.type === 'results') {
						results.value = (message.results || []).map(r => ({ ...r, collapsed: false }))
						has_more.value = message.has_more
						workspace_folders.value = message.workspace_folders || []
						selected.value = -1
						nextTick().then(highlight_search_terms)
					} else if (message.type === 'nav') {
						nav(message.direction)
					} else if (message.type === 'focus_search') {
						focus_search()
					}
				})
				window.addEventListener('keydown', on_keydown)
				onMounted(() => {
					search_input.value?.focus()
					if (search_query.value.trim())
						on_search_input()
				})
				return { search_query, include_query, exclude_query, show_filters, results, has_more, result_count_text, search_input, results_container, on_search_input, get_file_name, get_dir_path, open_match, toggle_file, is_file_selected, is_match_selected }
			}
		}).mount('#app')
	</script>

	<div id="app">
		<div class="search-container">

				</button>
			</div>
			<div v-if="show_filters" class="filters">
				<div class="filter-label">files to include</div>
				<div class="input-row">
					<input type="text" class="vscode-textfield filter-input" v-model="include_query" @input="on_search_input" placeholder="e.g. *.js, src/" autocomplete="off" />
					<button class="toggle-filters" :class="{ active: view_mode === 'tree' }" @click="toggle_view_mode" :title="view_mode === 'tree' ? 'View as List' : 'View as Tree'">
						<i class="codicon" :class="view_mode === 'tree' ? 'codicon-list-tree' : 'codicon-list-flat'"></i>
					</button>
				</div>
				<div class="filter-label">files to exclude</div>
				<input type="text" class="vscode-textfield filter-input" v-model="exclude_query" @input="on_search_input" placeholder="e.g. *.test.js, dist/" autocomplete="off" />
			</div>
		</div>
		<div v-if="loading || result_count_text" class="result-count">
			<template v-if="loading"><i class="codicon codicon-loading codicon-modifier-spin"></i> Loading…<span v-if="results.length"> — {{ results.length }} file{{ results.length === 1 ? '' : 's' }}</span></template>
			<template v-else>{{ result_count_text }}</template>
		</div>
		<div class="results-container" ref="results_container">

				No results found.

				<div v-if="row.kind === 'dir'" class="dir-header" :class="{ selected: selected === ri }" :style="{ paddingLeft: (row.depth * 12 + 4) + 'px' }" @click="toggle_dir(row.key)">
					<i class="codicon icon-arrow" :class="dir_collapsed[row.key] ? 'codicon-chevron-right' : 'codicon-chevron-down'"></i>
					<span class="dir-name">{{ row.label }}</span>
				</div>
				<div v-else-if="row.kind === 'file'" class="file-header" :class="{ selected: selected === ri }" :style="{ paddingLeft: (row.depth * 12 + 4) + 'px' }" @click="toggle_file(row.fi)">

					<img class="file-icon" :src="'img/file-icons/' + (results[row.fi].icon || 'default_file.svg')">

					<span v-if="view_mode === 'list'" class="file-path">{{ get_dir_path(results[row.fi].path) }}</span>
					<span class="badge">{{ results[row.fi].matches.length }}</span>
				</div>
				<div v-else class="match-line" :class="{ selected: selected === ri }" :style="{ paddingLeft: (row.depth * 12 + 20) + 'px' }" @click="open_match(row.fi, row.mi)">
					<span v-if="! results[row.fi].matches[row.mi].placeholder" class="line-number">{{ results[row.fi].matches[row.mi].line_number }}</span>
					<span class="line-text" :title="results[row.fi].matches[row.mi].line_text">{{ results[row.fi].matches[row.mi].line_text.trim() }}</span>

	<script type="module">
		import { createApp, ref, computed, onMounted, nextTick, watch } from 'vue'
		const vscode = acquireVsCodeApi()
		createApp({
			setup() {
				const search_query = ref(localStorage.getItem('search_query') || '')
				const include_query = ref(localStorage.getItem('search_include') || '')
				const exclude_query = ref(localStorage.getItem('search_exclude') || '')
				const show_filters = ref(localStorage.getItem('search_show_filters') === '1' || !! (include_query.value || exclude_query.value))
				const results = ref([])
				const has_more = ref(false)
				const loading = ref(false)
				const workspace_folders = ref([])
				const search_input = ref(null)
				const results_container = ref(null)
				const selected = ref(-1)
				let search_debouncer = null

				const result_count_text = computed(() => {
					if (! results.value.length) return ''
					const total_matches = results.value.reduce((sum, item) => sum + item.matches.length, 0)
					return total_matches + ' match' + (total_matches === 1 ? '' : 'es') +
						' in ' + results.value.length + ' file' + (results.value.length === 1 ? '' : 's') +
						(has_more.value ? ' (truncated, please refine your search)' : '')
				})

				const dir_collapsed = ref({})
				const toggle_dir = (key) => { dir_collapsed.value[key] = ! dir_collapsed.value[key] }
				const view_mode = ref(localStorage.getItem('search_view_mode') || 'tree')
				const toggle_view_mode = () => {
					view_mode.value = view_mode.value === 'tree' ? 'list' : 'tree'
					localStorage.setItem('search_view_mode', view_mode.value)
				}

				// Directory segments for a path: the workspace-folder name first, then each dir, excluding
				// the file's own name. Falls back to raw path segments for files outside any folder.
				const path_segments = (path) => {
					let folder = null
					let longest = -1
					for (const f of workspace_folders.value)
						if ((path === f.path || path.startsWith(f.path + '/')) && f.path.length > longest) {
							folder = f
							longest = f.path.length
						}
					if (folder) {
						const rel = path.slice(folder.path.length + 1).split('/')
						rel.pop()
						return [folder.name, ...rel]
					}
					const parts = path.split('/')
					parts.pop()
					return parts.filter(Boolean)
				}

				// Group the flat result files into a directory tree, collapsing single-child dir chains
				// (logic adapted from GitLG's files_tree). Each leaf dir node carries its files; `key` is
				// the full path from the root (stable, used for collapse state), `label` the display text.
				const tree = computed(() => {
					const root = { dirs: {}, files: [], key: '', label: '' }
					results.value.forEach((file, fi) => {
						let curr = root
						let acc = ''
						for (const seg of path_segments(file.path)) {
							acc = acc ? acc + '/' + seg : seg
							curr = curr.dirs[seg] ||= { dirs: {}, files: [], key: acc, label: seg }
						}
						curr.files.push({ fi })
					})
					const unify = (node) => {
						let modified = true
						while (modified) {
							modified = false
							for (const [k, child] of Object.entries(node.dirs))
								if (! child.files.length) {
									for (const gc of Object.values(child.dirs)) {
										gc.label = child.label + ' / ' + gc.label
										node.dirs[gc.label] = gc
									}
									delete node.dirs[k]
									modified = true
								} else unify(child)
						}
					}
					unify(root)
					return root
				})

				// A flat, ordered list of the currently-visible navigable rows (dir headers, file headers
				// and, for expanded files, their match lines), each with its tree depth for indentation.
				// Used by both the template and keyboard navigation.
				const flat_rows = computed(() => {
					const rows = []
					if (view_mode.value === 'list') {
						results.value.forEach((file, fi) => {
							rows.push({ kind: 'file', fi, depth: 0 })
							if (! file.collapsed)
								file.matches.forEach((match, mi) => rows.push({ kind: 'match', fi, mi, depth: 1 }))
						})
						return rows
					}
					const walk = (node, depth) => {
						for (const d of Object.values(node.dirs)) {
							rows.push({ kind: 'dir', key: d.key, label: d.label, depth })
							if (! dir_collapsed.value[d.key])
								walk(d, depth + 1)
						}
						for (const f of node.files) {
							rows.push({ kind: 'file', fi: f.fi, depth })
							const file = results.value[f.fi]
							if (! file.collapsed)
								file.matches.forEach((match, mi) => rows.push({ kind: 'match', fi: f.fi, mi, depth: depth + 1 }))
						}
					}
					walk(tree.value, 0)
					return rows
				})

				const row_key = (row) =>
					row.kind === 'dir' ? 'd:' + row.key
						: row.kind === 'file' ? 'f:' + results.value[row.fi].path
							: 'm:' + results.value[row.fi].path + ':' + row.mi

				const is_file_selected = (fi) => {
					const row = flat_rows.value[selected.value]
					return !! row && row.kind === 'file' && row.fi === fi
				}
				const is_match_selected = (fi, mi) => {
					const row = flat_rows.value[selected.value]
					return !! row && row.kind === 'match' && row.fi === fi && row.mi === mi
				}

				const scroll_selected_into_view = (block = 'nearest') => nextTick().then(() => {
					const el = results_container.value?.querySelector('.selected')
					el?.scrollIntoView({ block })
				})
				// Rendered rows map 1:1 to flat_rows (the no-results div is hidden while results exist).
				const scroll_row_into_view = (idx, block = 'nearest') => nextTick().then(() => {
					results_container.value?.children[idx]?.scrollIntoView({ block })
				})

				const move = (delta) => {
					const rows = flat_rows.value
					if (! rows.length) return
					let i = selected.value < 0 ? (delta > 0 ? 0 : rows.length - 1) : selected.value + delta
					if (i < 0) i = 0
					if (i >= rows.length) i = rows.length - 1
					selected.value = i
					scroll_selected_into_view()
				}

				const toggle_file = (fi) => {
					results.value[fi].collapsed = ! results.value[fi].collapsed
				}

				const open_match = (fi, mi) => {
					const file = results.value[fi]
					const match = file.matches[mi]
					// keep the clicked/activated row selected
					const rows = flat_rows.value
					const idx = rows.findIndex(r => r.kind === 'match' && r.fi === fi && r.mi === mi)
					if (idx !== -1) selected.value = idx
					vscode.postMessage({ type: 'open_file', path: file.path, line_number: match.line_number })
				}

				const activate = () => {
					const row = flat_rows.value[selected.value]
					if (! row) return
					if (row.kind === 'dir') toggle_dir(row.key)
					else if (row.kind === 'file') toggle_file(row.fi)
					else open_match(row.fi, row.mi)
				}

				const set_collapsed = (val) => {
					const row = flat_rows.value[selected.value]
					if (! row) return
					if (row.kind === 'dir')
						dir_collapsed.value[row.key] = val
					else if (row.kind === 'file')
						results.value[row.fi].collapsed = val
					else if (val) {
						// left on a match: jump up to its file header
						const rows = flat_rows.value
						for (let i = selected.value; i >= 0; i--)
							if (rows[i].kind === 'file') { selected.value = i; break }
						scroll_selected_into_view()
					}
				}

				// F4 / shift+F4 from the extension: go to next/previous match line and open it. Wraps around
				// at the ends, like the built-in search's F4.
				const nav = (direction) => {
					const rows = flat_rows.value
					if (! rows.length) return
					const step = direction === 'next' ? 1 : -1
					let i = selected.value
					for (let n = 0; n < rows.length; n++) {
						i += step
						if (i < 0) i = rows.length - 1
						else if (i >= rows.length) i = 0
						if (rows[i].kind === 'match') {
							selected.value = i
							scroll_selected_into_view()
							open_match(rows[i].fi, rows[i].mi)
							return
						}
					}
				}

				const focus_search = () => search_input.value?.focus()

				const on_keydown = (e) => {
					const target = e.target
					// let the include/exclude text inputs handle their own keys normally
					if (target && target.classList && target.classList.contains('filter-input')) return
					const in_search = target === search_input.value
					switch (e.key) {
						case 'ArrowDown':
							e.preventDefault()
							move(1)
							break
						case 'ArrowUp':
							if (in_search) break
							e.preventDefault()
							move(-1)
							break
						case 'Enter':
							e.preventDefault()
							if (in_search)
								trigger_search_now()
							else
								activate()
							break
						case 'ArrowRight':
							if (in_search) break
							e.preventDefault()
							set_collapsed(false)
							break
						case 'ArrowLeft':
							if (in_search) break
							e.preventDefault()
							set_collapsed(true)
							break
						case 'Escape':
							if (in_search) break
							e.preventDefault()
							focus_search()
							break
					}
				}

				const do_search = () => {
					localStorage.setItem('search_query', search_query.value)
					localStorage.setItem('search_include', include_query.value)
					localStorage.setItem('search_exclude', exclude_query.value)
					loading.value = !! search_query.value.trim()
					vscode.postMessage({
						type: 'search',
						query: search_query.value,
						include: include_query.value,
						exclude: exclude_query.value,
					})
				}
				const on_search_input = () => {
					clearTimeout(search_debouncer)
					search_debouncer = setTimeout(do_search, 10)
				}
				// Enter in the search box re-runs the search immediately to refresh stale results.
				const trigger_search_now = () => {
					clearTimeout(search_debouncer)
					do_search()
				}

				watch(show_filters, (v) => localStorage.setItem('search_show_filters', v ? '1' : '0'))
				watch(() => results.value.length, (len) =>
					vscode.postMessage({ type: 'has_results', value: len > 0 }))

				const get_file_name = (path) =>
					path.split('/').pop()

				const get_dir_path = (path) => {
					// Find the workspace folder this file belongs to
					let workspace_folder = null
					let longest_match = 0
					for (const folder of workspace_folders.value) {
						if (path.startsWith(folder.path + '/') && folder.path.length > longest_match) {
							workspace_folder = folder
							longest_match = folder.path.length
						}
					}
					if (! workspace_folder) {
						const parts = path.split('/')
						parts.pop()
						return parts.join('/')
					}
					let relative_path = path.substring(workspace_folder.path.length + 1)
					const parts = relative_path.split('/')
					parts.pop()
					const relative_dir = parts.join('/')
					return relative_dir ? `${workspace_folder.name} • ${relative_dir}` : workspace_folder.name
				}
				const highlight_search_terms = () => {
					if (! search_query.value.trim() || ! CSS.highlights) {
						CSS.highlights?.clear()
						return
					}
					CSS.highlights.clear()
					const ranges = []
					// case pseudo-sensitivity: an uppercase letter in the query makes highlighting case-sensitive
					const q = search_query.value.trim()
					const case_sensitive = q.toLowerCase() !== q
					const search_terms = q.split(/\s+/).filter(Boolean).map(t => case_sensitive ? t : t.toLowerCase())
					const line_elements = document.querySelectorAll('.line-text')
					line_elements.forEach(element => {
						const text = element.textContent
						if (! text) return
						const haystack = case_sensitive ? text : text.toLowerCase()
						search_terms.forEach(term => {
							let index = 0
							while ((index = haystack.indexOf(term, index)) !== -1) {
								const range = new Range()
								const text_node = element.firstChild
								if (text_node && text_node.nodeType === Node.TEXT_NODE) {
									range.setStart(text_node, index)
									range.setEnd(text_node, index + term.length)
									ranges.push(range)
								}
								index += term.length
							}
						})
					})
					if (ranges.length > 0) {
						const highlight = new Highlight(...ranges)
						CSS.highlights.set('search-match', highlight)
					}
				}
				// Capture the current selection as a stable identity (path + line) so it can be restored
				// after the results array is swapped (e.g. placeholder -> resolved line numbers).
				const capture_selection = () => {
					const row = flat_rows.value[selected.value]
					if (! row) return null
					if (row.kind === 'dir') return { kind: 'dir', key: row.key }
					const path = results.value[row.fi].path
					if (row.kind === 'file') return { path, line: null }
					return { path, line: results.value[row.fi].matches[row.mi]?.line_number }
				}
				const restore_selection = (sel) => {
					if (! sel) { selected.value = -1; return }
					const rows = flat_rows.value
					let idx = -1
					if (sel.kind === 'dir')
						idx = rows.findIndex(r => r.kind === 'dir' && r.key === sel.key)
					else if (sel.line == null)
						idx = rows.findIndex(r => r.kind === 'file' && results.value[r.fi].path === sel.path)
					else {
						idx = rows.findIndex(r => r.kind === 'match' && results.value[r.fi].path === sel.path && results.value[r.fi].matches[r.mi]?.line_number === sel.line)
						if (idx === -1) // line changed (placeholder -> real): fall back to the first match of that file
							idx = rows.findIndex(r => r.kind === 'match' && results.value[r.fi].path === sel.path)
						if (idx === -1)
							idx = rows.findIndex(r => (r.kind === 'file' || r.kind === 'match') && results.value[r.fi].path === sel.path)
					}
					selected.value = idx
				}
				window.addEventListener('message', (event) => {
					const message = event.data
					if (message.type === 'results') {
						if (message.phase === 'paths') {
							// Phase 1: candidate file names, each with the query text as a placeholder line.
							results.value = (message.results || []).map(r => ({ ...r, collapsed: false }))
							has_more.value = false
							if (message.workspace_folders) workspace_folders.value = message.workspace_folders
							selected.value = -1
							loading.value = true
							const container = results_container.value
							nextTick().then(() => { if (container) container.scrollTop = 0; highlight_search_terms() })
						} else {
							// Phase 2 (resolved lines) or empty final: keep selection (by path) and scroll
							// across the placeholder -> real swap.
							const sel = capture_selection()
							const container = results_container.value
							const prev_scroll = container ? container.scrollTop : 0
							const prev_collapsed = new Map(results.value.map(f => [f.path, f.collapsed]))
							results.value = (message.results || []).map(r => ({ ...r, collapsed: prev_collapsed.get(r.path) || false }))
							has_more.value = message.has_more
							if (message.workspace_folders) workspace_folders.value = message.workspace_folders
							loading.value = false
							restore_selection(sel)
							// If a selection survived the swap, keep it visible (its row may have moved when
							// placeholder lines became real matches); align the file-name row of the selected
							// match to the top so the file context shows. Otherwise preserve the scroll position.
							if (selected.value !== -1) {
								const row = flat_rows.value[selected.value]
								const parent = row?.kind === 'match' ? flat_rows.value.findIndex(r => r.kind === 'file' && r.fi === row.fi) : -1
								scroll_row_into_view(parent === -1 ? selected.value : parent, 'start')
							} else
								nextTick().then(() => { if (container) container.scrollTop = prev_scroll })
							nextTick().then(highlight_search_terms)
						}
					} else if (message.type === 'results_live') {
						// In-place update after the index changed: drop files that no longer match and
						// refresh the matches of already-shown files (never add new file entries), keeping
						// collapse state, scroll position and the current selection.
						const new_by_path = new Map((message.results || []).map(r => [r.path, r]))
						const sel_row = flat_rows.value[selected.value]
						const sel_id = ! sel_row ? null
							: sel_row.kind === 'file'
								? { path: results.value[sel_row.fi].path, line: null }
								: { path: results.value[sel_row.fi].path, line: results.value[sel_row.fi].matches[sel_row.mi]?.line_number }
						const container = results_container.value
						const prev_scroll = container ? container.scrollTop : 0
						results.value = results.value
							.filter(f => new_by_path.has(f.path))
							.map(f => ({ ...new_by_path.get(f.path), collapsed: f.collapsed }))
						has_more.value = message.has_more
						if (message.workspace_folders) workspace_folders.value = message.workspace_folders
						loading.value = false
						selected.value = ! sel_id ? -1 : flat_rows.value.findIndex(r =>
							sel_id.line == null
								? r.kind === 'file' && results.value[r.fi].path === sel_id.path
								: r.kind === 'match' && results.value[r.fi].path === sel_id.path && results.value[r.fi].matches[r.mi]?.line_number === sel_id.line)
						nextTick().then(() => {
							if (container) container.scrollTop = prev_scroll
							highlight_search_terms()
						})
					} else if (message.type === 'nav') {
						nav(message.direction)
					} else if (message.type === 'focus_search') {
						focus_search()
					}
				})
				window.addEventListener('keydown', on_keydown)
				onMounted(() => {
					search_input.value?.focus()
					if (search_query.value.trim())
						on_search_input()
				})
				return { search_query, include_query, exclude_query, show_filters, view_mode, toggle_view_mode, results, has_more, loading, result_count_text, search_input, results_container, selected, flat_rows, dir_collapsed, toggle_dir, row_key, on_search_input, get_file_name, get_dir_path, open_match, toggle_file, is_file_selected, is_match_selected }
			}
		}).mount('#app')
	</script>
</body>
